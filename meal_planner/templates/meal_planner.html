<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Πλάνο Γευμάτων - Supermarket Price Finder</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
/* Meal planner pieces, built on the shared style.css (palette #667eea / #764ba2, white cards) */
.card{background:white;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,0.1);padding:25px;margin-bottom:25px}
:focus-visible{outline:3px solid rgba(102,126,234,0.6);outline-offset:2px}

.tabs{position:sticky;top:10px;z-index:5;display:flex;gap:6px;background:white;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,0.15);padding:6px;margin-bottom:25px}
.tabs button{flex:1;white-space:nowrap;background:none;border:none;border-radius:8px;padding:12px 8px;font:inherit;font-weight:600;color:#667eea;cursor:pointer}
.tabs button:hover{background:#f5f7ff}
.tabs .ico{margin-right:4px}
.tabs button.on{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white}
.view{display:none}.view.on{display:block}

.summary{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px}
.totals{display:flex;flex-wrap:wrap;gap:30px}
.total-label{color:#666;font-size:0.9em;margin-bottom:4px}
.total-value{font-size:1.8em;font-weight:700;color:#667eea;font-variant-numeric:tabular-nums}
.total-value small{font-size:0.5em;font-weight:400;color:#999}
.total-value.over{color:#c62828}
.bar{height:10px;background:#eceefb;border-radius:6px;overflow:hidden;margin-top:20px}
.bar i{display:block;height:100%;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%)}
.bar.over i{background:#c62828}
.over-note{color:#c62828;font-size:0.9em;margin-top:10px}
.est-pill{display:inline-block;background:#fff8e1;border:1px solid #ffe082;color:#8a6500;border-radius:20px;padding:2px 10px;font-size:0.8em;font-weight:600}

.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:25px}
.day{background:white;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,0.1);padding:20px}
.day h2{font-size:1.3em;color:#333;border-bottom:3px solid #667eea;padding-bottom:10px;margin-bottom:15px}
.meal{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#f5f7ff 0%,#f0f0ff 100%);border-left:5px solid #c5cae9;border-radius:8px;padding:12px 14px;margin-bottom:10px}
.meal:last-child{margin-bottom:0}
.meal.leftover{background:#fafafa;border-left-color:#e0e0e0}
.meal-name{flex:1;min-width:0;background:none;border:none;font:inherit;text-align:left;cursor:pointer;color:#333}
.meal-type{display:block;font-size:0.85em;font-weight:600;color:#667eea;margin-bottom:3px}
.meal.leftover .meal-type{color:#999}
.meal-title{display:block;font-weight:600}
.meal-name:hover .meal-title{text-decoration:underline}
.meal-meta{display:block;font-size:0.85em;color:#666;margin-top:3px}
.btn-swap{width:38px;height:38px;flex-shrink:0;background:white;border:2px solid #e0e0e0;border-radius:50%;font-size:1.1em;color:#999;cursor:pointer;transition:border-color 0.2s,color 0.2s}
.btn-swap:hover{border-color:#667eea;color:#667eea}
.btn-swap:disabled{opacity:0.5;cursor:wait}

.store-totals{display:flex;flex-wrap:wrap;gap:8px}
.store-total{background:#f5f7ff;border:1px solid #d0d4f0;border-radius:20px;padding:6px 14px;color:#333;font-size:0.95em}
.store-total b{color:#667eea;font-variant-numeric:tabular-nums}
.aisle h2{font-size:1.2em;color:#333;border-bottom:3px solid #667eea;padding-bottom:10px;margin-bottom:5px}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #eee;cursor:pointer}
.item:last-child{border-bottom:none;padding-bottom:0}
.item input{width:20px;height:20px;margin-top:2px;flex-shrink:0;accent-color:#667eea}
.item-text{flex:1;min-width:0;color:#333}
.item-text small{display:block;color:#666;font-size:0.85em;margin-top:3px}
.item-cost{font-weight:700;color:#667eea;white-space:nowrap;font-variant-numeric:tabular-nums}
.item.done .item-text,.item.done .item-cost{opacity:0.45;text-decoration:line-through}

#f{display:grid;gap:20px}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:15px}
.field{display:grid;gap:6px;min-width:0;font-weight:600;color:#333;font-size:0.95em}
.field input,.field select{width:100%;min-width:0;padding:12px;border:2px solid #e0e0e0;border-radius:8px;background:white;font:inherit;font-weight:400;color:#333;transition:border-color 0.3s}
.field input:focus,.field select:focus{outline:none;border-color:#667eea}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{display:flex;align-items:center;gap:6px;border:1px solid #d0d4f0;border-radius:20px;padding:6px 14px;font-size:0.9em;color:#333;cursor:pointer}
.chips label:has(input:checked){background:#f5f7ff;border-color:#667eea}
.chips input{accent-color:#667eea}
.choices .chips{max-height:240px;overflow:auto}
.actions{display:flex;flex-wrap:wrap;gap:12px}
.actions .btn-search{flex:1}

.empty{text-align:center;padding:40px 20px;color:#999}
.empty p{margin-bottom:20px}

dialog{margin:auto;border:none;border-radius:12px;padding:0;max-width:560px;width:calc(100% - 24px);box-shadow:0 8px 32px rgba(0,0,0,0.25)}
dialog::backdrop{background:rgba(40,30,80,0.55)}
.dlg{padding:25px;color:#333;line-height:1.5}
.dlg h2{font-size:1.4em;line-height:1.25;border-bottom:3px solid #667eea;padding-bottom:10px;margin-bottom:8px}
.dlg h4{color:#764ba2;margin:18px 0 6px}
.dlg ul,.dlg ol{padding-left:22px}
.dlg li{margin:4px 0}
.dlg a{color:#667eea}
.dlg details{margin-top:8px}
.dlg summary{cursor:pointer;font-weight:600;color:#764ba2;padding:4px 0}
.dlg summary:focus:not(:focus-visible){outline:none}
.dlg .btn-check-favourites{width:100%;margin-top:20px}
.muted{color:#888}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;font-weight:600;padding:12px 20px;border-radius:8px;box-shadow:0 8px 16px rgba(102,126,234,0.4);display:none;z-index:9;max-width:calc(100% - 32px)}

@media (max-width: 768px) {
  .card,.day{padding:18px}
  .days{grid-template-columns:1fr}
  .tabs button{padding:10px 4px;font-size:0.9em}
  .totals{gap:20px}
  .total-value{font-size:1.5em}
  .summary .btn-search{width:100%}
}
@media (max-width: 480px) {
  .row{grid-template-columns:1fr}
  .tabs .ico{display:none}
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🍽️ Πλάνο Γευμάτων</h1>
    <p class="subtitle" id="sub">Εβδομαδιαίο πρόγραμμα με τιμές από τα supermarkets</p>
    <nav class="nav">
      <a href="/" class="nav-link">🔍 Αναζήτηση</a>
      <a href="/favourites" class="nav-link">⭐ Αγαπημένα</a>
      <a href="/meals/" class="nav-link nav-current">🍽️ Πλάνο γευμάτων</a>
    </nav>
  </header>

  <div class="tabs" role="tablist">
    <button data-v="week" class="on"><span class="ico" aria-hidden="true">📅</span>Εβδομάδα</button>
    <button data-v="shop"><span class="ico" aria-hidden="true">🛒</span>Λίστα αγορών</button>
    <button data-v="set"><span class="ico" aria-hidden="true">⚙️</span>Ρυθμίσεις</button>
  </div>

  <section class="view on" id="v-week">
    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <p>Φτιάχνω το πλάνο και ψάχνω τιμές...</p>
    </div>
    <div id="sum"></div>
    <div id="days" class="days"></div>
  </section>
  <section class="view" id="v-shop">
    <div id="shop"></div>
  </section>
  <section class="view" id="v-set">
    <form id="f" class="card">
      <div class="row">
        <label class="field">Άτομα<input type="number" name="persons" min="1" max="12" value="2"></label>
        <label class="field">Budget εβδομάδας (€)<input type="number" name="budget" min="0" step="1" value="60"></label>
      </div>
      <div class="row">
        <label class="field">Supermarket<select name="store" id="store"></select></label>
        <label class="field">Διατροφή<select name="diet" id="diet"></select></label>
      </div>
      <label class="field" id="srcwrap" hidden>Συνταγές<select name="source" id="source"></select></label>
      <div class="field">Γεύματα<div class="chips" id="meals"></div></div>
      <div class="chips">
        <label><input type="checkbox" name="leftovers" checked> Το βραδινό γίνεται μεσημεριανό της επόμενης</label>
        <label><input type="checkbox" name="include_pantry"> Μέτρα και τα βασικά (λάδι, μπαχαρικά)</label>
      </div>
      <details class="choices"><summary>Υλικά που δεν θέλω / αλλεργίες</summary><div class="chips" id="excl"></div></details>
      <div class="actions">
        <button class="btn-search" id="go" type="submit">🍽️ Φτιάξε πλάνο</button>
        <button class="btn-check-favourites" type="button" id="refresh">🔄 Ανανέωση τιμών</button>
      </div>
    </form>
  </section>
</div>
<dialog id="dlg"><div class="dlg" id="dlgc"></div></dialog>
<div class="toast" id="toast" role="status"></div>
<script>
const $ = s => document.querySelector(s);
const API = location.pathname.replace(/\/$/, '') + '/api';
let META = null, PLAN = null;
const MEAL_KEYS = ['breakfast', 'lunch', 'dinner'];
const eur = v => (v ?? 0).toLocaleString('el-GR', {style: 'currency', currency: 'EUR'});
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtQ = (q, u) => u === 'pcs' ? `${q} τεμ` : q >= 1000 ? `${+(q/1000).toFixed(2)} ${u === 'g' ? 'kg' : 'l'}` : `${Math.round(q)} ${u}`;

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 2600); }
function show(v) {
  document.querySelectorAll('.view').forEach(x => x.classList.toggle('on', x.id === 'v-' + v));
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  scrollTo(0, 0);
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => show(b.dataset.v));

async function api(path, body) {
  const r = await fetch(API + path, body === undefined ? {} : {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || 'Σφάλμα');
  return j;
}

function storeName(k) { return k === 'cheapest' ? 'Φθηνότερο ανά προϊόν' : k === 'estimate' ? 'Εκτίμηση' : (META.stores[k] || k); }

function buildForm() {
  $('#store').innerHTML = Object.entries(META.stores).map(([k, v]) => `<option value="${k}">${v}</option>`).join('') + '<option value="cheapest">Φθηνότερο ανά προϊόν (όλα)</option>';
  $('#diet').innerHTML = Object.entries(META.diets).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
  const sc = META.source_counts || {};
  $('#source').innerHTML = ['all', 'builtin', 'imported'].map(k => `<option value="${k}">${META.sources[k]}${k === 'all' ? '' : ` (${sc[k] || 0})`}</option>`).join('');
  $('#srcwrap').hidden = !sc.imported;
  $('#meals').innerHTML = MEAL_KEYS.map(k => [k, META.meals[k]]).map(([k, v]) => `<label><input type="checkbox" name="meals" value="${k}" checked> ${v}</label>`).join('');
  $('#excl').innerHTML = META.ingredients.filter(i => !i.pantry).map(i => `<label><input type="checkbox" name="exclude" value="${i.id}"> ${esc(i.name)}</label>`).join('');
}

function fillForm(s) {
  const f = $('#f');
  f.persons.value = s.persons; f.budget.value = s.budget; f.store.value = s.store; f.diet.value = s.diet;
  f.source.value = s.source || 'all';
  f.leftovers.checked = s.leftovers; f.include_pantry.checked = s.include_pantry;
  f.querySelectorAll('[name=meals]').forEach(c => c.checked = s.meals.includes(c.value));
  f.querySelectorAll('[name=exclude]').forEach(c => c.checked = s.exclude.includes(c.value));
}

function readForm() {
  const f = $('#f');
  return {
    persons: +f.persons.value, budget: +f.budget.value, store: f.store.value, diet: f.diet.value, source: f.source.value,
    leftovers: f.leftovers.checked, include_pantry: f.include_pantry.checked,
    meals: [...f.querySelectorAll('[name=meals]:checked')].map(c => c.value),
    exclude: [...f.querySelectorAll('[name=exclude]:checked')].map(c => c.value),
  };
}

function render() {
  if (!PLAN) {
    $('#days').innerHTML = `<div class="card empty"><p>Δεν υπάρχει πλάνο ακόμα. Διάλεξε άτομα, budget και supermarket για να φτιάξεις το πρώτο.</p><button class="btn-search" onclick="show('set')">⚙️ Ρυθμίσεις πλάνου</button></div>`;
    $('#sum').innerHTML = ''; $('#shop').innerHTML = '<div class="card empty"><p>Η λίστα αγορών θα εμφανιστεί μόλις φτιάξεις πλάνο.</p></div>';
    return;
  }
  const s = PLAN.settings, pct = s.budget ? Math.min(100, PLAN.total / s.budget * 100) : 100;
  $('#sub').textContent = `${s.persons} άτομα · ${storeName(s.store)} · ${META.diets[s.diet]}`;
  $('#sum').innerHTML = `
    <div class="card">
      <div class="summary">
        <div class="totals">
          <div><div class="total-label">Σύνολο εβδομάδας</div>
            <div class="total-value ${PLAN.within_budget ? '' : 'over'}">${eur(PLAN.total)} <small>από ${eur(s.budget)}</small></div></div>
          <div><div class="total-label">Ανά άτομο τη μέρα</div><div class="total-value">${eur(PLAN.total / s.persons / 7)}</div></div>
        </div>
        <button class="btn-search" id="regen">🔄 Νέο πλάνο</button>
      </div>
      <div class="bar ${PLAN.within_budget ? '' : 'over'}"><i style="width:${pct}%"></i></div>
      ${PLAN.within_budget ? '' : '<div class="over-note">Δεν χωράει στο budget με αυτά τα φίλτρα — αυτό είναι το φθηνότερο που βρέθηκε.</div>'}
      ${PLAN.estimated ? `<div style="margin-top:12px"><span class="est-pill">${PLAN.estimated} τιμές εκτιμώμενες</span></div>` : ''}
    </div>`;
  $('#regen').onclick = () => generate(PLAN.settings);

  $('#days').innerHTML = PLAN.days.map((d, di) => `
    <div class="day"><h2>${d.name}</h2>
      ${MEAL_KEYS.filter(m => d.meals[m]).map(m => {
        const x = d.meals[m];
        return `<div class="meal ${x.leftover ? 'leftover' : ''}">
          <button class="meal-name" data-r="${x.recipe_id}" data-p="${x.cook_portions || s.persons}">
            <span class="meal-type">${META.meals[m]}</span>
            <span class="meal-title">${esc(x.name)}</span>
            <span class="meal-meta">${x.leftover ? 'Από το χθεσινό βραδινό' : `${x.time}′${x.cook_portions > s.persons ? ` · μαγείρεψε ${x.cook_portions} μερίδες` : ''}`}</span>
          </button>
          <button class="btn-swap" title="Άλλη συνταγή" aria-label="Άλλη συνταγή" data-d="${di}" data-m="${m}">↻</button>
        </div>`;
      }).join('')}
    </div>`).join('');
  $('#days').querySelectorAll('.meal-name').forEach(el => el.onclick = () => openRecipe(el.dataset.r, el.dataset.p));
  $('#days').querySelectorAll('button[data-d]').forEach(b => b.onclick = () => swap(+b.dataset.d, b.dataset.m, b));

  const key = 'mp-check-' + PLAN.generated_at;
  let checked = {}; try { checked = JSON.parse(localStorage.getItem(key) || '{}'); } catch (e) {}
  const stores = Object.entries(PLAN.by_store).map(([k, v]) => `<span class="store-total">${storeName(k)}: <b>${eur(v)}</b></span>`).join('');
  $('#shop').innerHTML = `<div class="card store-totals">${stores}</div>` + PLAN.shopping.map(g => `
    <div class="card aisle"><h2>${esc(g.aisle)}</h2>
      ${g.items.map(it => `<label class="item ${checked[it.id] ? 'done' : ''}">
        <input type="checkbox" data-i="${it.id}" ${checked[it.id] ? 'checked' : ''}>
        <div class="item-text">${esc(it.name)} — ${fmtQ(it.need, it.unit)}
          <small>${it.estimated ? '<span class="est-pill">εκτίμηση τιμής · δεν βρέθηκε προϊόν</span>' :
            `${it.packs}× ${esc(it.product)}${s.store === 'cheapest' ? ' · ' + storeName(it.store) : ''}`}</small></div>
        <div class="item-cost">${eur(it.cost)}</div></label>`).join('')}
    </div>`).join('');
  $('#shop').querySelectorAll('input[data-i]').forEach(c => c.onchange = () => {
    checked[c.dataset.i] = c.checked; c.closest('.item').classList.toggle('done', c.checked);
    try { localStorage.setItem(key, JSON.stringify(checked)); } catch (e) {}
  });
}

async function openRecipe(id, portions) {
  const r = await api(`/recipe/${id}?portions=${portions}`);
  const scaled = `<ul>${r.ingredients.map(i => `<li>${esc(i.name)} — ${esc(i.qty)}${i.pantry ? ' <span class="muted">(ντουλάπι)</span>' : ''}</li>`).join('')}</ul>`;
  const ingHtml = r.original
    ? `<h4>Υλικά <span class="muted" style="font-weight:400">(πρωτότυπη συνταγή, ${r.original.servings} μερίδες)</span></h4>
       <ul>${r.original.lines.map(l => `<li>${esc(l)}</li>`).join('')}</ul>
       <details><summary>Ποσότητες για ${r.persons} μερίδες (όπως κοστολογήθηκαν)</summary>${scaled}</details>`
    : `<h4>Υλικά</h4>${scaled}`;
  $('#dlgc').innerHTML = `<h2>${esc(r.name)}</h2><div class="muted">${r.time}′ · ${r.persons} μερίδες</div>
    ${ingHtml}
    <h4>Εκτέλεση</h4><ol>${r.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>
    ${r.source ? `<p class="muted" style="font-size:0.9em;margin-top:12px">Πηγή: <a href="${esc(r.source)}" target="_blank" rel="noopener">${esc(r.source_name || r.source)}</a></p>` : ''}
    <button class="btn-check-favourites" onclick="dlg.close()">Κλείσιμο</button>`;
  $('#dlg').showModal();
  if (document.activeElement) document.activeElement.blur();
  $('#dlgc').scrollTop = 0;
}
$('#dlg').onclick = e => { if (e.target.id === 'dlg') e.target.close(); };

function loading(on) {
  $('#loading').classList.toggle('hidden', !on);
  $('#sum').hidden = $('#days').hidden = on;
}

async function generate(settings) {
  const btns = document.querySelectorAll('#go,#regen'); btns.forEach(b => b.disabled = true);
  show('week'); loading(true);
  try { PLAN = await api('/plan', settings); fillForm(PLAN.settings); render(); toast('Το πλάνο είναι έτοιμο'); }
  catch (e) { toast(e.message); }
  finally { loading(false); btns.forEach(b => b.disabled = false); }
}
async function swap(day, meal, btn) {
  btn.disabled = true;
  try { PLAN = await api('/swap', {day, meal}); render(); } catch (e) { toast(e.message); btn.disabled = false; }
}
$('#f').onsubmit = e => { e.preventDefault(); generate(readForm()); };
$('#refresh').onclick = async e => {
  const b = e.currentTarget; b.disabled = true; toast('Ανανέωση τιμών…');
  try { const p = await api('/refresh-prices', {}); if (p) { PLAN = p; render(); } toast('Οι τιμές ανανεώθηκαν'); }
  catch (err) { toast(err.message); } finally { b.disabled = false; }
};

(async () => {
  META = await api('/meta'); buildForm();
  if (!META.connected) $('#sub').textContent = 'Δεν έχει συνδεθεί αναζήτηση τιμών — χρησιμοποιούνται εκτιμήσεις';
  PLAN = await api('/plan');
  if (PLAN) fillForm(PLAN.settings);
  render();
})();
</script>
</body>
</html>
