<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Πλάνο Γευμάτων - Supermarket Price Finder</title>
<link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" sizes="any">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<meta name="theme-color" content="#667eea">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
/* Meal planner pieces, built on the shared style.css (palette #667eea / #764ba2, white cards) */
.card{background:white;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,0.1);padding:25px;margin-bottom:25px}
:focus-visible{outline:3px solid rgba(102,126,234,0.6);outline-offset:2px}

.tabs{position:sticky;top:10px;z-index:5;display:flex;gap:6px;background:white;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,0.15);padding:6px;margin-bottom:25px}
.tabs button{flex:1;white-space:nowrap;background:none;border:none;border-radius:8px;padding:12px 8px;font:inherit;font-weight:600;color:#667eea;cursor:pointer}
.tabs button:hover{background:#f5f7ff}
.tabs .ico{margin-right:4px}
.tabs button.on{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white}
.view{display:none}.view.on{display:block}

.summary{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px}
.totals{display:flex;flex-wrap:wrap;gap:30px}
.total-label{color:#666;font-size:0.9em;margin-bottom:4px}
.total-value{font-size:1.8em;font-weight:700;color:#667eea;font-variant-numeric:tabular-nums}
.total-value small{font-size:0.5em;font-weight:400;color:#999}
.total-value.over{color:#c62828}
.bar{height:10px;background:#eceefb;border-radius:6px;overflow:hidden;margin-top:20px}
.bar i{display:block;height:100%;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%)}
.bar.over i{background:#c62828}
.over-note{color:#c62828;font-size:0.9em;margin-top:10px}
.est-pill{display:inline-block;background:#fff8e1;border:1px solid #ffe082;color:#8a6500;border-radius:20px;padding:2px 10px;font-size:0.8em;font-weight:600}

.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:25px}
.day{background:white;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,0.1);padding:20px}
.day h2{font-size:1.3em;color:#333;border-bottom:3px solid #667eea;padding-bottom:10px;margin-bottom:15px}
.meal{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#f5f7ff 0%,#f0f0ff 100%);border-left:5px solid #c5cae9;border-radius:8px;padding:12px 14px;margin-bottom:10px}
.meal:last-child{margin-bottom:0}
.meal.leftover{background:#fafafa;border-left-color:#e0e0e0}
.meal-name{flex:1;min-width:0;background:none;border:none;font:inherit;text-align:left;cursor:pointer;color:#333}
.meal-type{display:block;font-size:0.85em;font-weight:600;color:#667eea;margin-bottom:3px}
.meal.leftover .meal-type{color:#999}
.meal-title{display:block;font-weight:600}
.meal-name:hover .meal-title{text-decoration:underline}
.meal-meta{display:block;font-size:0.85em;color:#666;margin-top:3px}
.btn-swap{width:38px;height:38px;flex-shrink:0;background:white;border:2px solid #e0e0e0;border-radius:50%;font-size:1.1em;color:#999;cursor:pointer;transition:border-color 0.2s,color 0.2s}
.btn-swap:hover{border-color:#667eea;color:#667eea}
.btn-swap:disabled{opacity:0.5;cursor:wait}

.store-totals{display:flex;flex-wrap:wrap;gap:8px}
.store-total{background:#f5f7ff;border:1px solid #d0d4f0;border-radius:20px;padding:6px 14px;color:#333;font-size:0.95em}
.store-total b{color:#667eea;font-variant-numeric:tabular-nums}
.aisle h2{font-size:1.2em;color:#333;border-bottom:3px solid #667eea;padding-bottom:10px;margin-bottom:5px}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #eee;cursor:pointer}
.item:last-child{border-bottom:none;padding-bottom:0}
.item input{width:20px;height:20px;margin-top:2px;flex-shrink:0;accent-color:#667eea}
.item-text{flex:1;min-width:0;color:#333}
.item-text small{display:block;color:#666;font-size:0.85em;margin-top:3px}
.item-cost{font-weight:700;color:#667eea;white-space:nowrap;font-variant-numeric:tabular-nums}
.item.done .item-text,.item.done .item-cost{opacity:0.45;text-decoration:line-through}

#f{display:grid;gap:20px}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:15px}
.field{display:grid;gap:6px;min-width:0;font-weight:600;color:#333;font-size:0.95em}
.field input,.field select{width:100%;min-width:0;padding:12px;border:2px solid #e0e0e0;border-radius:8px;background:white;font:inherit;font-weight:400;color:#333;transition:border-color 0.3s}
.field input:focus,.field select:focus{outline:none;border-color:#667eea}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{display:flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid #d0d4f0;border-radius:20px;padding:6px 14px;font-size:0.9em;color:#333;cursor:pointer}
.chips label:has(input:checked){background:#f5f7ff;border-color:#667eea}
.chips input{accent-color:#667eea}
.choices .chips{max-height:240px;overflow:auto}
.actions{display:flex;flex-wrap:wrap;gap:12px}
.actions .btn-search{flex:1}

.empty{text-align:center;padding:40px 20px;color:#999}
.empty p{margin-bottom:20px}

dialog{margin:auto;border:none;border-radius:12px;padding:0;max-width:560px;width:calc(100% - 24px);box-shadow:0 8px 32px rgba(0,0,0,0.25)}
dialog::backdrop{background:rgba(40,30,80,0.55)}
.dlg{padding:25px;color:#333;line-height:1.5}
.dlg h2{font-size:1.4em;line-height:1.25;border-bottom:3px solid #667eea;padding-bottom:10px;margin-bottom:8px}
.dlg h4{color:#764ba2;margin:18px 0 6px}
.dlg ul,.dlg ol{padding-left:22px}
.dlg li{margin:4px 0}
.dlg a{color:#667eea}
.dlg details{margin-top:8px}
.dlg summary{cursor:pointer;font-weight:600;color:#764ba2;padding:4px 0}
.dlg summary:focus:not(:focus-visible){outline:none}
.dlg .btn-check-favourites{width:100%;margin-top:20px}
.muted{color:#888}

.pick-note{color:#666;font-size:0.9em}
.pick-tools{display:flex;gap:10px;margin:15px 0 8px}
.pick-search{flex:1;min-width:0;padding:12px;border:2px solid #e0e0e0;border-radius:8px;font:inherit;color:#333;transition:border-color 0.3s}
.pick-search:focus{outline:none;border-color:#667eea}
.pick-tools .btn-check-favourites{flex-shrink:0;width:auto;margin:0}
.pick-count{color:#888;font-size:0.85em;margin-bottom:6px}
.pick-list{max-height:50vh;overflow:auto;padding-right:2px}
.pick-item{display:flex;gap:6px;align-items:stretch}
.pick-item[hidden]{display:none}
.pick-item .choice{flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:12px;text-align:left}
.pick-main{min-width:0;color:#333}
.pick-main small{display:block;color:#888;font-size:0.85em;font-weight:400;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick-cost{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600;color:#666}
.pick-search::placeholder{color:#aaa}
.pick-cost small{display:block;font-weight:400;color:#999;font-size:0.8em}
.pick-cost.cheaper{color:#2e7d32}
.pick-cost.dearer{color:#c62828}
.btn-view{flex-shrink:0;width:42px;background:white;border:1px solid #e0e0e0;border-radius:6px;font-size:1.1em;cursor:pointer}
.btn-view:hover{border-color:#667eea}
.tag{display:inline-block;font-size:0.85em;font-weight:600;border-radius:10px;padding:0 8px;margin-right:4px;background:#eceefb;color:#667eea}
.tag.warn{background:#fff8e1;color:#8a6500}
.tag.over{background:#fdecea;color:#c62828}
.dlg .back{background:none;border:none;color:#667eea;font:inherit;font-weight:600;cursor:pointer;padding:0;margin-bottom:10px}
.left-note{display:block;color:#8a6500;margin-top:2px}

.my-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.my-head h2{font-size:1.3em;color:#333}
.my-actions{display:flex;flex-wrap:wrap;gap:10px}
.my-actions .btn-search{padding:10px 20px;font-size:1em}
.my-item{display:flex;align-items:center;gap:6px;padding:12px 0;border-bottom:1px solid #eee}
.my-item:first-of-type{margin-top:10px}
.my-item:last-child{border-bottom:none;padding-bottom:0}
.my-item .btn-view{height:42px}
.btn-view.danger:hover{border-color:#c62828}
.btn-view.armed{border-color:#c62828;background:#fdecea}
.btn-view:disabled{opacity:0.35;cursor:default}
.ed{display:grid;gap:20px}
.field textarea{width:100%;min-width:0;padding:12px;border:2px solid #e0e0e0;border-radius:8px;background:white;font:inherit;font-weight:400;color:#333;resize:vertical;transition:border-color 0.3s}
.field textarea:focus{outline:none;border-color:#667eea}
.hint{color:#888;font-weight:400;font-size:0.9em}
.ing-rows{display:grid;gap:14px}
.ing-row{display:grid;grid-template-columns:minmax(0,1fr) 96px 34px 42px 42px;gap:6px;align-items:center}
.ing-row input{width:100%;min-width:0;padding:10px;border:2px solid #e0e0e0;border-radius:8px;font:inherit;font-weight:400;color:#333}
.ing-row input:focus{outline:none;border-color:#667eea}
.ing-row .btn-view{height:42px}
.ing-unit{color:#666;font-weight:400;font-size:0.9em;text-align:center}
.ing-status{grid-column:1/-1;font-weight:400;font-size:0.85em;color:#2e7d32;margin-top:-2px}
.ing-status .warn{color:#8a6500}
.ing-status .muted{color:#888}
#ed-add{justify-self:start}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;font-weight:600;padding:12px 20px;border-radius:8px;box-shadow:0 8px 16px rgba(102,126,234,0.4);display:none;z-index:9;max-width:calc(100% - 32px)}

@media (max-width: 768px) {
  .card,.day{padding:18px}
  .days{grid-template-columns:1fr}
  .tabs button{padding:10px 4px;font-size:0.9em}
  .totals{gap:20px}
  .total-value{font-size:1.5em}
  .summary .btn-search{width:100%}
}
@media (max-width: 480px) {
  .row{grid-template-columns:1fr}
  .tabs .ico{display:none}
  .ing-row{grid-template-columns:minmax(0,1fr) 72px 30px 40px 40px;gap:4px}
}
</style>
</head>
<body>
<div class="container">
  <header>
    <a href="/" class="brand"><img src="{{ url_for('static', filename='img/logo.png') }}" alt="Price Finder" width="800" height="180"></a>
    <h1>🍽️ Πλάνο Γευμάτων</h1>
    <p class="subtitle" id="sub">Εβδομαδιαίο πρόγραμμα με τιμές από τα supermarkets</p>
    <nav class="nav">
      <a href="/" class="nav-link">🔍 Αναζήτηση</a>
      <a href="/favourites" class="nav-link">⭐ Αγαπημένα</a>
      <a href="/meals/" class="nav-link nav-current">🍽️ Πλάνο γευμάτων</a>
    </nav>
  </header>

  <div class="tabs" role="tablist">
    <button data-v="week" class="on"><span class="ico" aria-hidden="true">📅</span>Εβδομάδα</button>
    <button data-v="shop"><span class="ico" aria-hidden="true">🛒</span>Λίστα αγορών</button>
    <button data-v="my"><span class="ico" aria-hidden="true">📝</span>Συνταγές μου</button>
    <button data-v="set"><span class="ico" aria-hidden="true">⚙️</span>Ρυθμίσεις</button>
  </div>

  <section class="view on" id="v-week">
    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <p>Φτιάχνω το πλάνο και ψάχνω τιμές...</p>
    </div>
    <div id="sum"></div>
    <div id="days" class="days"></div>
  </section>
  <section class="view" id="v-shop">
    <div id="shop"></div>
  </section>
  <section class="view" id="v-my">
    <div id="my"></div>
  </section>
  <section class="view" id="v-set">
    <form id="f" class="card">
      <div class="row">
        <label class="field">Άτομα<input type="number" name="persons" min="1" max="12" value="2"></label>
        <label class="field">Budget εβδομάδας (€)<input type="number" name="budget" min="0" step="1" value="60"></label>
      </div>
      <div class="row">
        <label class="field">Supermarket<select name="store" id="store"></select></label>
        <label class="field">Διατροφή<select name="diet" id="diet"></select></label>
      </div>
      <label class="field" id="srcwrap" hidden>Συνταγές<select name="source" id="source"></select></label>
      <div class="field">Γεύματα<div class="chips" id="meals"></div></div>
      <div class="chips">
        <label><input type="checkbox" name="leftovers" checked> Το βραδινό γίνεται μεσημεριανό της επόμενης</label>
        <label><input type="checkbox" name="include_pantry"> Μέτρα και τα βασικά (λάδι, μπαχαρικά)</label>
      </div>
      <div class="field"><span>Συσκευές που έχω <span class="hint">— οι συνταγές που θέλουν κάποια άλλη δεν μπαίνουν στο πλάνο</span></span><div class="chips" id="apps"></div></div>
      <details class="choices"><summary>Υλικά που δεν θέλω / αλλεργίες</summary><div class="chips" id="excl"></div></details>
      <div class="actions">
        <button class="btn-search" id="go" type="submit">🍽️ Φτιάξε πλάνο</button>
        <button class="btn-check-favourites" type="button" id="refresh">🔄 Ανανέωση τιμών</button>
      </div>
    </form>
  </section>
</div>
<dialog id="dlg"><div class="dlg" id="dlgc"></div></dialog>
<div class="toast" id="toast" role="status"></div>
<script>
const $ = s => document.querySelector(s);
const API = location.pathname.replace(/\/$/, '') + '/api';
let META = null, PLAN = null;
const MEAL_KEYS = ['breakfast', 'lunch', 'dinner'];
const eur = v => (v ?? 0).toLocaleString('el-GR', {style: 'currency', currency: 'EUR'});
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtQ = (q, u) => u === 'pcs' ? `${q} τεμ` : q >= 1000 ? `${+(q/1000).toFixed(2)} ${u === 'g' ? 'kg' : 'l'}` : `${Math.round(q)} ${u}`;

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 2600); }
function show(v) {
  document.querySelectorAll('.view').forEach(x => x.classList.toggle('on', x.id === 'v-' + v));
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  scrollTo(0, 0);
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => show(b.dataset.v));

async function api(path, body) {
  const r = await fetch(API + path, body === undefined ? {} : {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || 'Σφάλμα');
  return j;
}

function storeName(k) { return k === 'cheapest' ? 'Φθηνότερο ανά προϊόν' : k === 'estimate' ? 'Εκτίμηση' : (META.stores[k] || k); }

function buildForm() {
  $('#store').innerHTML = Object.entries(META.stores).map(([k, v]) => `<option value="${k}">${v}</option>`).join('') + '<option value="cheapest">Φθηνότερο ανά προϊόν (όλα)</option>';
  $('#diet').innerHTML = Object.entries(META.diets).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
  const sc = META.source_counts || {};
  $('#source').innerHTML = ['all', 'builtin', 'imported', 'custom'].filter(k => k === 'all' || k === 'builtin' || sc[k])
    .map(k => `<option value="${k}">${META.sources[k]}${k === 'all' ? '' : ` (${sc[k] || 0})`}</option>`).join('');
  $('#srcwrap').hidden = !sc.imported && !sc.custom;
  $('#meals').innerHTML = MEAL_KEYS.map(k => [k, META.meals[k]]).map(([k, v]) => `<label><input type="checkbox" name="meals" value="${k}" checked> ${v}</label>`).join('');
  $('#apps').innerHTML = Object.entries(META.appliances).map(([k, v]) => `<label><input type="checkbox" name="appliances" value="${k}" checked> ${esc(v)}</label>`).join('');
  $('#excl').innerHTML = META.ingredients.filter(i => !i.pantry).map(i => `<label><input type="checkbox" name="exclude" value="${i.id}"> ${esc(i.name)}</label>`).join('');
}

function fillForm(s) {
  const f = $('#f');
  f.persons.value = s.persons; f.budget.value = s.budget; f.store.value = s.store; f.diet.value = s.diet;
  f.source.value = s.source || 'all';
  f.leftovers.checked = s.leftovers; f.include_pantry.checked = s.include_pantry;
  f.querySelectorAll('[name=meals]').forEach(c => c.checked = s.meals.includes(c.value));
  f.querySelectorAll('[name=exclude]').forEach(c => c.checked = s.exclude.includes(c.value));
  // Plans made before the appliances setting assume every appliance
  f.querySelectorAll('[name=appliances]').forEach(c => c.checked = !s.appliances || s.appliances.includes(c.value));
}

function readForm() {
  const f = $('#f');
  return {
    persons: +f.persons.value, budget: +f.budget.value, store: f.store.value, diet: f.diet.value, source: f.source.value,
    leftovers: f.leftovers.checked, include_pantry: f.include_pantry.checked,
    meals: [...f.querySelectorAll('[name=meals]:checked')].map(c => c.value),
    exclude: [...f.querySelectorAll('[name=exclude]:checked')].map(c => c.value),
    appliances: [...f.querySelectorAll('[name=appliances]:checked')].map(c => c.value),
  };
}

function render() {
  if (!PLAN) {
    $('#days').innerHTML = `<div class="card empty"><p>Δεν υπάρχει πλάνο ακόμα. Διάλεξε άτομα, budget και supermarket για να φτιάξεις το πρώτο.</p><button class="btn-search" onclick="show('set')">⚙️ Ρυθμίσεις πλάνου</button></div>`;
    $('#sum').innerHTML = ''; $('#shop').innerHTML = '<div class="card empty"><p>Η λίστα αγορών θα εμφανιστεί μόλις φτιάξεις πλάνο.</p></div>';
    return;
  }
  const s = PLAN.settings, pct = s.budget ? Math.min(100, PLAN.total / s.budget * 100) : 100;
  $('#sub').textContent = `${s.persons} άτομα · ${storeName(s.store)} · ${META.diets[s.diet]}`;
  $('#sum').innerHTML = `
    <div class="card">
      <div class="summary">
        <div class="totals">
          <div><div class="total-label">Σύνολο εβδομάδας</div>
            <div class="total-value ${PLAN.within_budget ? '' : 'over'}">${eur(PLAN.total)} <small>από ${eur(s.budget)}</small></div></div>
          <div><div class="total-label">Ανά άτομο τη μέρα</div><div class="total-value">${eur(PLAN.total / s.persons / 7)}</div></div>
        </div>
        <button class="btn-search" id="regen">🔄 Νέο πλάνο</button>
      </div>
      <div class="bar ${PLAN.within_budget ? '' : 'over'}"><i style="width:${pct}%"></i></div>
      ${PLAN.within_budget ? '' : '<div class="over-note">Δεν χωράει στο budget με αυτά τα φίλτρα — αυτό είναι το φθηνότερο που βρέθηκε.</div>'}
      ${PLAN.estimated ? `<div style="margin-top:12px"><span class="est-pill">${PLAN.estimated} τιμές εκτιμώμενες</span></div>` : ''}
    </div>`;
  $('#regen').onclick = () => generate(PLAN.settings);

  $('#days').innerHTML = PLAN.days.map((d, di) => `
    <div class="day"><h2>${d.name}</h2>
      ${MEAL_KEYS.filter(m => d.meals[m]).map(m => {
        const x = d.meals[m];
        return `<div class="meal ${x.leftover ? 'leftover' : ''}">
          <button class="meal-name" data-r="${x.recipe_id}" data-p="${x.cook_portions || s.persons}">
            <span class="meal-type">${META.meals[m]}</span>
            <span class="meal-title">${esc(x.name)}</span>
            <span class="meal-meta">${x.leftover ? 'Από το χθεσινό βραδινό' : `${x.time}′${x.cook_portions > s.persons ? ` · μαγείρεψε ${x.cook_portions} μερίδες` : ''}`}</span>
          </button>
          <button class="btn-swap" title="Διάλεξε άλλη συνταγή" aria-label="Διάλεξε άλλη συνταγή" data-d="${di}" data-m="${m}">↻</button>
        </div>`;
      }).join('')}
    </div>`).join('');
  $('#days').querySelectorAll('.meal-name').forEach(el => el.onclick = () => openRecipe(el.dataset.r, el.dataset.p));
  $('#days').querySelectorAll('button[data-d]').forEach(b => b.onclick = () => openPicker(+b.dataset.d, b.dataset.m, b));

  const key = 'mp-check-' + PLAN.generated_at;
  let checked = {}; try { checked = JSON.parse(localStorage.getItem(key) || '{}'); } catch (e) {}
  const stores = Object.entries(PLAN.by_store).map(([k, v]) => `<span class="store-total">${storeName(k)}: <b>${eur(v)}</b></span>`).join('');
  $('#shop').innerHTML = `<div class="card store-totals">${stores}</div>` + PLAN.shopping.map(g => `
    <div class="card aisle"><h2>${esc(g.aisle)}</h2>
      ${g.items.map(it => `<label class="item ${checked[it.id] ? 'done' : ''}">
        <input type="checkbox" data-i="${it.id}" ${checked[it.id] ? 'checked' : ''}>
        <div class="item-text">${esc(it.name)} — ${fmtQ(it.need, it.unit)}
          <small>${it.estimated ? '<span class="est-pill">εκτίμηση τιμής · δεν βρέθηκε προϊόν</span>' :
            `${it.packs}× ${esc(it.product)}${s.store === 'cheapest' ? ' · ' + storeName(it.store) : ''}`}
            ${it.leftover >= (it.unit === 'pcs' ? 1 : 5) ? `<span class="left-note">❗ Περισσεύουν ${fmtQ(it.leftover, it.unit)} — κράτα τα, θα τα ξαναχρησιμοποιήσεις</span>` : ''}</small></div>
        <div class="item-cost">${eur(it.cost)}</div></label>`).join('')}
    </div>`).join('');
  $('#shop').querySelectorAll('input[data-i]').forEach(c => c.onchange = () => {
    checked[c.dataset.i] = c.checked; c.closest('.item').classList.toggle('done', c.checked);
    try { localStorage.setItem(key, JSON.stringify(checked)); } catch (e) {}
  });
}

function openDialog(html) {
  $('#dlgc').innerHTML = html;
  if (!$('#dlg').open) $('#dlg').showModal();
  if (document.activeElement) document.activeElement.blur();
  $('#dlgc').scrollTop = 0;
}

// back: shown as "← Πίσω στη λίστα" when the recipe is opened from the recipe picker
async function openRecipe(id, portions, back) {
  const r = await api(`/recipe/${id}?portions=${portions}`);
  const scaled = `<ul>${r.ingredients.map(i => `<li>${esc(i.name)} — ${esc(i.qty)}${i.pantry ? ' <span class="muted">(ντουλάπι)</span>' : ''}</li>`).join('')}</ul>`;
  const ingHtml = r.original
    ? `<h4>Υλικά <span class="muted" style="font-weight:400">(${r.original.custom ? 'η συνταγή σου' : 'πρωτότυπη συνταγή'}, ${r.original.servings} μερίδες)</span></h4>
       <ul>${r.original.lines.map(l => `<li>${esc(l)}</li>`).join('')}</ul>
       <details><summary>Ποσότητες για ${r.persons} μερίδες (όπως κοστολογήθηκαν)</summary>${scaled}</details>`
    : `<h4>Υλικά</h4>${scaled}`;
  openDialog(`${back ? '<button class="back" id="back">← Πίσω στη λίστα</button>' : ''}
    <h2>${esc(r.name)}</h2><div class="muted">${r.time}′ · ${r.persons} μερίδες${r.appliances.length ? ` · Χρειάζεται: ${esc(r.appliances.join(', '))}` : ''}</div>
    ${ingHtml}
    <h4>Εκτέλεση</h4><ol>${r.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>
    ${r.source ? `<p class="muted" style="font-size:0.9em;margin-top:12px">Πηγή: <a href="${esc(r.source)}" target="_blank" rel="noopener">${esc(r.source_name || r.source)}</a></p>` : ''}
    <button class="btn-check-favourites" onclick="dlg.close()">Κλείσιμο</button>`);
  if (back) $('#back').onclick = back;
}
$('#dlg').onclick = e => { if (e.target.id === 'dlg') e.target.close(); };

// Lowercase without accents, final ς as σ, so that "μπιφτεκια" finds "Μπιφτέκια"
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/ς/g, 'σ');
const slotName = ([d, m]) => `${META.meals[m]} ${PLAN.days[d].name}`;

async function openPicker(day, meal, btn) {
  btn.disabled = true;
  const title = `<h2>${esc(META.meals[meal])} · ${esc(PLAN.days[day].name)}</h2>`;
  openDialog(`${title}<div class="pick-count"><div class="spinner"></div>Υπολογίζω πόσο κοστίζει κάθε συνταγή…</div>`);
  let alt;
  try { alt = await api(`/alternatives?day=${day}&meal=${meal}`); }
  catch (e) { $('#dlg').close(); toast(e.message); return; }
  finally { btn.disabled = false; }
  renderPicker(day, meal, title, alt, '');
}

function renderPicker(day, meal, title, alt, query) {
  const others = alt.slots.filter(([d, m]) => d !== day || m !== meal);
  const portions = PLAN.settings.persons * alt.slots.length;
  const cost = o => {
    const diff = Math.round((o.total - alt.total) * 100) / 100;
    const cls = !o.within_budget ? 'dearer' : diff < 0 ? 'cheaper' : '';
    const label = o.current ? 'τώρα' : diff === 0 ? 'ίδιο κόστος' : `${diff > 0 ? '+' : '−'}${eur(Math.abs(diff))}`;
    return `<span class="pick-cost ${cls}">${label}<small>σύνολο ${eur(o.total)}</small></span>`;
  };
  const tags = o => [
    o.current ? '<span class="tag">τωρινή</span>' : '',
    o.custom ? '<span class="tag">δική μου</span>' : '',
    o.in_plan ? '<span class="tag warn">ήδη στο πλάνο</span>' : '',
    o.within_budget ? '' : '<span class="tag over">εκτός budget</span>',
  ].join('');
  openDialog(`${title}
    ${others.length ? `<div class="pick-note">Μαγειρεύεται και για: ${others.map(slotName).join(', ')}</div>` : ''}
    <div class="pick-note">Πρώτα όσες χωράνε στο budget, μετά οι φθηνότερες. Το ποσό είναι η αλλαγή στο σύνολο της εβδομάδας.</div>
    <div class="pick-tools">
      <input type="search" class="pick-search" id="pickq" placeholder="Αναζήτηση…" aria-label="Αναζήτηση συνταγής ή υλικού" autocomplete="off">
      <button class="btn-check-favourites" id="pickrand" title="Τυχαία από τις καλύτερες">🎲 Τυχαία</button>
    </div>
    <div class="pick-count" id="pickn"></div>
    <div class="choice-list pick-list">
      ${alt.options.map((o, i) => `<div class="pick-item" data-q="${esc(norm(o.name + ' ' + o.ingredients.join(' ')))}">
        <button class="choice ${o.current ? 'choice-selected' : ''}" data-i="${i}">
          <span class="pick-main">${tags(o)}${esc(o.name)}<small>${o.time}′ · ${esc(o.ingredients.join(', '))}</small></span>
          ${cost(o)}
        </button>
        <button class="btn-view" data-v="${i}" title="Δες τη συνταγή" aria-label="Δες τη συνταγή">📖</button>
      </div>`).join('')}
    </div>
    <button class="btn-check-favourites" onclick="dlg.close()">Κλείσιμο</button>`);

  const input = $('#pickq'), items = [...document.querySelectorAll('.pick-item')];
  const filter = () => {
    const words = norm(input.value).split(/\s+/).filter(Boolean);
    let n = 0;
    items.forEach(el => { el.hidden = !words.every(w => el.dataset.q.includes(w)); n += !el.hidden; });
    $('#pickn').textContent = words.length ? `${n} από ${items.length} συνταγές` : `${items.length} συνταγές`;
  };
  input.value = query;
  input.oninput = filter;
  filter();
  $('#pickrand').onclick = async e => { e.currentTarget.disabled = true; await swap(day, meal); $('#dlg').close(); };
  document.querySelectorAll('.pick-item .choice').forEach(b => b.onclick = () => choose(day, meal, alt.options[+b.dataset.i], b));
  document.querySelectorAll('.pick-item .btn-view').forEach(b => b.onclick = () =>
    openRecipe(alt.options[+b.dataset.v].id, portions, () => renderPicker(day, meal, title, alt, input.value)));
}

async function choose(day, meal, option, btn) {
  if (option.current) { $('#dlg').close(); return; }
  btn.disabled = true;
  try {
    PLAN = await api('/choose', {day, meal, recipe_id: option.id});
    render(); $('#dlg').close(); toast(`Άλλαξε σε: ${option.name}`);
  } catch (e) { toast(e.message); btn.disabled = false; }
}

// ---- Own recipes ----------------------------------------------------------
// MY: the saved ones. ED: the recipe in the form, rows = [{name, iid, amount, text, newIng, hint, free}]:
// iid is a known ingredient, newIng a product picked in a store ({query, type, product}), neither = not costed.
let MY = [], ED = null;
const UNIT_LABEL = {g: 'g', ml: 'ml', pcs: 'τεμ'};
const ingById = id => META.ingredients.find(i => i.id === id);
const ingByName = name => name.trim() && META.ingredients.find(i => norm(i.name) === norm(name).trim());
const rowUnit = r => r.iid ? ingById(r.iid)?.unit : r.newIng ? r.newIng.product.unit : null;
const rowText = r => { const u = rowUnit(r); return u && r.amount ? `${r.name.trim()} — ${fmtQ(r.amount, u)}` : r.name.trim(); };

async function loadMy() { MY = await api('/custom'); if (!ED) renderMy(); }

function renderMy() {
  const kind = r => r.meal.includes('breakfast') ? META.meals.breakfast : 'Μεσημεριανό / Βραδινό';
  $('#my').innerHTML = `<div class="card">
    <div class="my-head"><h2>Οι συνταγές μου</h2>
      <div class="my-actions">
        <button class="btn-check-favourites" id="my-paste">📋 Από κείμενο</button>
        <button class="btn-search" id="my-new">➕ Νέα συνταγή</button>
      </div></div>
    ${MY.length ? MY.map((r, i) => `<div class="my-item">
        <button class="meal-name" data-i="${i}"><span class="meal-title">${esc(r.name)}</span>
          <span class="meal-meta">${kind(r)} · ${r.servings} μερίδες · ${r.time}′</span></button>
        <button class="btn-view" data-place="${i}" title="Βάλ' τη στο πλάνο" aria-label="Βάλ' τη στο πλάνο">📅</button>
        <button class="btn-view" data-edit="${i}" title="Επεξεργασία" aria-label="Επεξεργασία">✏️</button>
        <button class="btn-view danger" data-del="${i}" title="Διαγραφή" aria-label="Διαγραφή">🗑️</button>
      </div>`).join('')
      : `<p class="muted" style="margin-top:15px">Δεν έχεις γράψει δική σου συνταγή ακόμα. Γράψ' τη στη φόρμα ή επικόλλησέ τη από όπου τη βρήκες —
         μετά μπαίνει στα πλάνα όπως όλες οι άλλες.</p>`}
  </div>`;
  $('#my-new').onclick = () => openEditor(null, false);
  $('#my-paste').onclick = () => openEditor(null, true);
  $('#my').querySelectorAll('.meal-name').forEach(b => b.onclick = () => openRecipe(MY[b.dataset.i].id, MY[b.dataset.i].servings));
  $('#my').querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openEditor(MY[b.dataset.edit], false));
  $('#my').querySelectorAll('[data-place]').forEach(b => b.onclick = () => placeDialog(MY[b.dataset.place]));
  $('#my').querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    // Two clicks, so that a recipe is not deleted by mistake
    if (!b.classList.contains('armed')) {
      b.classList.add('armed'); toast('Πάτα ξανά 🗑️ για διαγραφή');
      setTimeout(() => b.classList.remove('armed'), 3000); return;
    }
    b.disabled = true;
    try { await api(`/custom/${encodeURIComponent(MY[b.dataset.del].id)}/delete`, {}); await refreshMeta(); await loadMy(); toast('Η συνταγή διαγράφηκε'); }
    catch (e) { toast(e.message); b.disabled = false; }
  });
}

function openEditor(r, paste) {
  ED = r ? {
    id: r.id, name: r.name, meal: r.meal.includes('breakfast') ? 'breakfast' : 'main', servings: r.servings, time: r.time,
    steps: r.steps.join('\n'), appliances: r.appliances ?? null,
    rows: r.lines.map(l => ({name: l.ingredient ? ingById(l.ingredient)?.name || l.text : l.text, iid: l.ingredient, amount: l.amount, text: l.text})),
  } : {id: null, name: '', meal: 'main', servings: 4, time: 30, steps: '', rows: [{name: ''}, {name: ''}, {name: ''}], appliances: null};
  renderEditor(paste);
  scrollTo(0, 0);
}

function renderEditor(paste) {
  $('#my').innerHTML = `<div class="card ed">
    <div class="my-head"><h2>${ED.id ? 'Επεξεργασία συνταγής' : 'Νέα συνταγή'}</h2></div>
    <details class="choices" style="margin:0" ${paste ? 'open' : ''}><summary>📋 Επικόλληση από κείμενο</summary>
      <label class="field" style="margin-top:8px"><span>Επικόλλησε όλη τη συνταγή <span class="hint">— όνομα, υλικά, εκτέλεση. Μετά διόρθωσε ό,τι χρειάζεται στη φόρμα.</span></span>
        <textarea id="ed-text" rows="8" placeholder="Κοτόπουλο με philadelphia&#10;4 μερίδες, 40 λεπτά&#10;Υλικά&#10;600 γρ. φιλέτο κοτόπουλο&#10;1 κουτί philadelphia 200g&#10;Εκτέλεση&#10;…"></textarea></label>
      <button type="button" class="btn-check-favourites" id="ed-parse" style="margin-top:10px">Συμπλήρωσε τη φόρμα</button>
    </details>
    <label class="field">Όνομα<input id="ed-name" value="${esc(ED.name)}" placeholder="π.χ. Κοτόπουλο με philadelphia"></label>
    <div class="row">
      <label class="field">Γεύμα<select id="ed-meal"><option value="main">Μεσημεριανό / Βραδινό</option><option value="breakfast">Πρωινό</option></select></label>
      <div class="row">
        <label class="field">Μερίδες<input id="ed-serv" type="number" min="1" max="24" value="${ED.servings}"></label>
        <label class="field">Λεπτά<input id="ed-time" type="number" min="1" max="600" value="${ED.time}"></label>
      </div>
    </div>
    <div class="field"><span>Υλικά <span class="hint">— ποσότητες για τις μερίδες της συνταγής. Ό,τι δεν είναι υλικό από τη λίστα ή προϊόν από το σούπερ (π.χ. αλάτι) δεν κοστολογείται.</span></span>
      <div class="ing-rows" id="ed-rows"></div>
      <button type="button" class="btn-check-favourites" id="ed-add">➕ Υλικό</button>
    </div>
    <label class="field"><span>Εκτέλεση <span class="hint">— ένα βήμα σε κάθε γραμμή</span></span><textarea id="ed-steps" rows="6">${esc(ED.steps)}</textarea></label>
    <div class="field"><span>Συσκευές που χρειάζεται <span class="hint">— τις βρίσκω από την εκτέλεση, διόρθωσέ τες αν χρειάζεται</span></span>
      <div class="chips" id="ed-apps">${Object.entries(META.appliances).map(([k, v]) => `<label><input type="checkbox" value="${k}"> ${esc(v)}</label>`).join('')}</div></div>
    <div class="actions">
      <button type="button" class="btn-search" id="ed-save">💾 Αποθήκευση</button>
      <button type="button" class="btn-check-favourites" id="ed-cancel">Άκυρο</button>
    </div>
  </div>
  <datalist id="inglist">${META.ingredients.map(i => `<option value="${esc(i.name)}">`).join('')}</datalist>`;
  $('#ed-meal').value = ED.meal;
  renderRows();
  // ED.appliances stays null until the user ticks one: until then they follow the steps
  const tick = list => $('#ed-apps').querySelectorAll('input').forEach(c => c.checked = list.includes(c.value));
  const detect = async () => {
    if (ED.appliances) return;
    try { tick(await api('/custom/appliances', {text: $('#ed-name').value + '\n' + $('#ed-steps').value})); } catch (e) {}
  };
  if (ED.appliances) tick(ED.appliances); else detect();
  $('#ed-apps').onchange = () => ED.appliances = [...$('#ed-apps').querySelectorAll('input:checked')].map(c => c.value);
  let timer;
  $('#ed-steps').oninput = $('#ed-name').oninput = () => { clearTimeout(timer); timer = setTimeout(detect, 500); };
  $('#ed-add').onclick = () => { ED.rows.push({name: ''}); renderRows(); $('#ed-rows').lastElementChild.querySelector('.ing-name').focus(); };
  $('#ed-cancel').onclick = () => { ED = null; renderMy(); };
  $('#ed-save').onclick = e => saveEditor(e.currentTarget);
  $('#ed-parse').onclick = async e => {
    const text = $('#ed-text').value.trim();
    if (!text) { toast('Επικόλλησε πρώτα τη συνταγή'); return; }
    e.currentTarget.disabled = true;
    try {
      const d = await api('/custom/parse', {text});
      Object.assign(ED, {
        name: d.name || $('#ed-name').value, meal: $('#ed-meal').value, servings: d.servings || +$('#ed-serv').value,
        time: d.time || +$('#ed-time').value, steps: d.steps.join('\n') || $('#ed-steps').value, appliances: null,
        rows: d.lines.map(l => ({name: l.ingredient ? ingById(l.ingredient)?.name : l.title, iid: l.ingredient, amount: l.amount,
                                 text: l.text, hint: l.hint, free: l.free})),
      });
      if (!ED.rows.length) ED.rows.push({name: ''});
      renderEditor(false);
      const unknown = ED.rows.filter(r => !r.iid && !r.free).length;
      toast(unknown ? `Έλεγξε τη φόρμα — ${unknown === 1 ? "1 υλικό θέλει" : unknown + " υλικά θέλουν"} 🔍` : 'Έλεγξε τη φόρμα και αποθήκευσε');
    } catch (err) { toast(err.message); e.currentTarget.disabled = false; }
  };
}

function rowStatus(r) {
  const orig = r.text && r.text !== rowText(r) ? ` <span class="muted">· «${esc(r.text)}»</span>` : '';
  if (r.iid) return `✓ ${esc(ingById(r.iid)?.name)}${orig}`;
  if (r.newIng) {
    const p = r.newIng.product;
    return `🆕 ${esc(p.name)} · ${esc(storeName(p.store))} · ${eur(p.price)} <span class="muted">· νέο υλικό, θα το βρίσκεις και στις επόμενες συνταγές</span>`;
  }
  if (!r.name.trim()) return '';
  return `<span class="warn">${r.free ? 'Δεν κοστολογείται' : 'Δεν το βρήκα στη λίστα — πάτα 🔍 να διαλέξεις προϊόν, αλλιώς δεν κοστολογείται'}</span>${orig}`;
}

function renderRows() {
  $('#ed-rows').innerHTML = ED.rows.map((r, k) => `<div class="ing-row" data-k="${k}">
    <input class="ing-name" list="inglist" value="${esc(r.name)}" placeholder="Υλικό, π.χ. Φέτα" aria-label="Υλικό" autocomplete="off">
    <input class="ing-qty" type="number" min="0" step="any" value="${r.amount ?? ''}" placeholder="Ποσ." aria-label="Ποσότητα">
    <span class="ing-unit"></span>
    <button type="button" class="btn-view ing-find" title="Βρες το στο σούπερ" aria-label="Βρες το στο σούπερ">🔍</button>
    <button type="button" class="btn-view ing-del" title="Αφαίρεση" aria-label="Αφαίρεση">✕</button>
    <div class="ing-status"></div>
  </div>`).join('');
  $('#ed-rows').querySelectorAll('.ing-row').forEach(el => {
    const r = ED.rows[+el.dataset.k];
    const update = () => {
      el.querySelector('.ing-unit').textContent = UNIT_LABEL[rowUnit(r)] || '';
      el.querySelector('.ing-status').innerHTML = rowStatus(r);
      el.querySelector('.ing-find').disabled = !!r.iid;
    };
    el.querySelector('.ing-name').oninput = e => {
      r.name = e.target.value; r.text = ''; r.free = false;
      const ing = ingByName(r.name);
      r.iid = ing ? ing.id : null;
      if (ing) r.newIng = null;
      update();
    };
    el.querySelector('.ing-qty').oninput = e => { r.amount = +e.target.value || null; r.text = ''; update(); };
    el.querySelector('.ing-find').onclick = () => {
      if (!r.name.trim()) { toast('Γράψε πρώτα το υλικό'); el.querySelector('.ing-name').focus(); return; }
      openProductSearch(r);
    };
    el.querySelector('.ing-del').onclick = () => { ED.rows.splice(+el.dataset.k, 1); renderRows(); };
    update();
  });
}

async function openProductSearch(r) {
  const s = PLAN ? PLAN.settings.store : 'sklavenitis';
  openDialog(`<h2>Βρες «${esc(r.name.trim())}» στο σούπερ</h2>
    <div class="pick-note">Ψάχνει με τον τίτλο — το μέγεθος δεν χρειάζεται να είναι ίδιο με της συνταγής. Αν η συσκευασία είναι μεγαλύτερη,
      στη λίστα αγορών θα δεις ❗ με ό,τι περισσεύει.</div>
    <div class="pick-tools">
      <input type="search" class="pick-search" id="pq" value="${esc(r.newIng?.query || r.name.trim())}" aria-label="Τι να ψάξω">
      <button class="btn-check-favourites" id="pgo">🔍 Ψάξε</button>
    </div>
    <div class="row" style="margin-bottom:12px">
      <label class="field">Supermarket<select id="pstore"><option value="all">Όλα</option>${Object.entries(META.stores).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></label>
      <label class="field">Είδος <select id="ptype">${Object.entries(META.types).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></label>
    </div>
    <div class="pick-count" id="pn"></div>
    <div class="choice-list pick-list" id="plist"></div>
    <button class="btn-check-favourites" onclick="dlg.close()">Κλείσιμο</button>`);
  $('#pstore').value = META.stores[s] ? s : 'all';
  let typeSet = !!r.newIng;
  if (r.newIng) $('#ptype').value = r.newIng.type;
  $('#ptype').onchange = () => typeSet = true;
  const per = p => p.unit === 'pcs' ? `${eur(p.price / p.size)}/τεμ` : `${eur(p.price / p.size * 1000)}/${p.unit === 'g' ? 'kg' : 'l'}`;
  const run = async () => {
    const q = $('#pq').value.trim();
    if (!q) return;
    $('#pn').innerHTML = '<div class="spinner"></div>Ψάχνω…'; $('#plist').innerHTML = '';
    let res;
    try { res = await api(`/products?q=${encodeURIComponent(q)}&store=${$('#pstore').value}`); }
    catch (e) { $('#pn').textContent = e.message; return; }
    if (!typeSet) $('#ptype').value = res.type;
    const multi = $('#pstore').value === 'all';
    $('#pn').textContent = res.products.length ? `${res.products.length} προϊόντα — διάλεξε αυτό που θα αγόραζες` : 'Δεν βρέθηκε τίποτα. Δοκίμασε άλλη λέξη.';
    $('#plist').innerHTML = res.products.map((p, i) => `<button class="choice" data-i="${i}">
        <span class="pick-main">${esc(p.name)}<small>${fmtQ(p.size, p.unit)} · ${per(p)}${multi ? ' · ' + esc(storeName(p.store)) : ''}</small></span>
        <span class="pick-cost">${eur(p.price)}</span></button>`).join('');
    $('#plist').querySelectorAll('.choice').forEach(b => b.onclick = () => {
      const p = res.products[+b.dataset.i];
      r.newIng = {query: q, type: $('#ptype').value, product: {store: p.store, name: p.name, price: p.price, size: p.size, unit: p.unit}};
      r.iid = null;
      if (!r.amount && r.hint && r.hint.unit === p.unit) r.amount = r.hint.amount;
      $('#dlg').close(); renderRows();
    });
  };
  $('#pgo').onclick = run;
  $('#pstore').onchange = run;
  $('#pq').onkeydown = e => { if (e.key === 'Enter') run(); };
  run();
}

async function saveEditor(btn) {
  const rows = ED.rows.filter(r => r.name.trim() || r.text);
  const body = {
    id: ED.id, name: $('#ed-name').value, meal: $('#ed-meal').value, servings: +$('#ed-serv').value, time: +$('#ed-time').value,
    steps: $('#ed-steps').value.split('\n'),
    appliances: [...$('#ed-apps').querySelectorAll('input:checked')].map(c => c.value),
    lines: rows.map(r => ({text: r.text || rowText(r), ingredient: r.iid || null, amount: r.amount || null,
                           new: r.newIng ? {name: r.name.trim(), ...r.newIng} : null})),
  };
  btn.disabled = true;
  let saved;
  try { saved = await api('/custom', body); }
  catch (e) { toast(e.message); btn.disabled = false; return; }
  ED = null;
  await refreshMeta();
  if (PLAN) { PLAN = await api('/plan'); render(); }
  await loadMy();
  toast('Η συνταγή αποθηκεύτηκε');
  if (!body.id && PLAN) placeDialog(saved);
}

// Ingredients and recipe counts change with own recipes
async function refreshMeta() {
  META = await api('/meta');
  const s = PLAN ? PLAN.settings : readForm();
  buildForm(); fillForm(s);
}

function placeDialog(r) {
  if (!PLAN) { toast('Φτιάξε πρώτα ένα πλάνο'); return; }
  const meals = r.meal.includes('breakfast') ? ['breakfast'] : ['lunch', 'dinner'];
  const slots = [];
  PLAN.days.forEach((d, di) => meals.forEach(m => { const x = d.meals[m]; if (x && !x.leftover) slots.push([di, m, x]); }));
  openDialog(`<h2>Βάλ' τη στο πλάνο</h2>
    <div class="pick-note">Σε ποιο γεύμα να μπει «${esc(r.name)}»;</div>
    ${slots.length ? `<div class="choice-list pick-list">${slots.map(([d, m, x], i) => `<button class="choice ${x.recipe_id === r.id ? 'choice-selected' : ''}" data-i="${i}">
        <span class="pick-main">${esc(slotName([d, m]))}<small>Τώρα: ${esc(x.name)}${x.cook_portions > PLAN.settings.persons ? ' · και μεσημεριανό της επόμενης' : ''}</small></span></button>`).join('')}</div>`
      : '<p class="muted" style="margin-top:12px">Το πλάνο δεν έχει τέτοιο γεύμα.</p>'}
    <button class="btn-check-favourites" onclick="dlg.close()">Όχι τώρα</button>`);
  $('#dlgc').querySelectorAll('.choice').forEach(b => b.onclick = async () => {
    const [d, m] = slots[+b.dataset.i];
    b.disabled = true;
    try { PLAN = await api('/choose', {day: d, meal: m, recipe_id: r.id}); render(); $('#dlg').close(); toast(`Μπήκε: ${slotName([d, m])}`); }
    catch (e) { toast(e.message); b.disabled = false; }
  });
}

function loading(on) {
  $('#loading').classList.toggle('hidden', !on);
  $('#sum').hidden = $('#days').hidden = on;
}

async function generate(settings) {
  const btns = document.querySelectorAll('#go,#regen'); btns.forEach(b => b.disabled = true);
  show('week'); loading(true);
  try { PLAN = await api('/plan', settings); fillForm(PLAN.settings); render(); toast('Το πλάνο είναι έτοιμο'); }
  catch (e) { toast(e.message); }
  finally { loading(false); btns.forEach(b => b.disabled = false); }
}
async function swap(day, meal) {
  try { PLAN = await api('/swap', {day, meal}); render(); toast(`Άλλαξε σε: ${PLAN.days[day].meals[meal].name}`); }
  catch (e) { toast(e.message); }
}
$('#f').onsubmit = e => { e.preventDefault(); generate(readForm()); };
$('#refresh').onclick = async e => {
  const b = e.currentTarget; b.disabled = true; toast('Ανανέωση τιμών…');
  try { const p = await api('/refresh-prices', {}); if (p) { PLAN = p; render(); } toast('Οι τιμές ανανεώθηκαν'); }
  catch (err) { toast(err.message); } finally { b.disabled = false; }
};

(async () => {
  META = await api('/meta'); buildForm();
  if (!META.connected) $('#sub').textContent = 'Δεν έχει συνδεθεί αναζήτηση τιμών — χρησιμοποιούνται εκτιμήσεις';
  PLAN = await api('/plan');
  if (PLAN) fillForm(PLAN.settings);
  render();
  loadMy();
})();
</script>
</body>
</html>
